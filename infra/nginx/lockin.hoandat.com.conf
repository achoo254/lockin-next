# .65: /etc/nginx/conf.d/lockin.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here -> the static web app
# from the current release, and /api/, /auth/, /k/, /healthz to the Node server on loopback :5300 of this host.
# The Cloudflare real-IP restore is global on this host, so $remote_addr is the visitor's IP; the server
# trusts X-Forwarded-For from loopback only.

server {
    listen 80;
    listen [::]:80;
    server_name lockin.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lockin.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/lockin.hoandat.com.access.log;
    error_log  /var/log/nginx/lockin.hoandat.com.error.log;

    root /var/www/lockin/current/apps/web/dist;
    # Plans and votes are a few hundred bytes of JSON.
    client_max_body_size 16k;

    # Plan links (/k/<token>: the page with its link preview) and the guest API (/api/k/<token>/…) carry the share
    # token in the path. They go to the server and stay out of the access log, so a token never lands on disk.
    location ~ ^/(api/)?k/ {
        access_log off;
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5300;
        proxy_set_header Host $host;
    }

    # Every non-API response carries these. nginx drops inherited add_header lines in a block that declares
    # its own, so /assets/ repeats the ones it needs. The API stays out: the server (helmet) sends its own.
    # Cloudflare Web Analytics is allowed in script-src/connect-src (the privacy page says so). The pages have no
    # inline script to allow (apps/web/index-html.test.ts keeps it that way). Images may also come
    # from Google and GitHub: the account pictures shown in the header's account menu.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # index.html (also as the SPA fallback) and the other unhashed files are revalidated on every visit, so
        # a browser never keeps a page that points at chunks of a previous release.
        add_header Cache-Control "no-cache" always;

        try_files $uri /index.html;

        # Hashed build files: cached for a year; a miss is a real 404, never index.html served as JavaScript.
        # This block sets its own headers, so it repeats the ones that matter for scripts.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            try_files $uri =404;
        }
    }
}
