# Deploy of lockin.hoandat.com: # build the web app, the server bundle and the migrations, upload them as the
# restricted `lockin-deploy` user to /var/www/lockin/ci-incoming/<id> and switch
# through the one sudo command that user has (infra/activate-incoming.sh:
# release, `current`, restart, healthz + origin check, previous release back on
# failure). Building (which runs dependency code) happens in a job without the
# deploy key; the deploy job only downloads the artifact, uploads it and
# activates it. nginx, the unit and the root scripts change only through
# infra/deploy.sh setup.
# When it runs: by hand or script (`gh workflow run deploy.yml`, or tools/deploy-prod.sh in the hoandat-app
# workspace), and every evening at 22:25 Asia/Saigon when main is ahead of the last successful deploy; never on
# a push, because AI sessions push to main many times a day. A run deploys the tip of main once `ci` of that commit
# has passed (it waits for a `ci` still running and stops on a failed one).
name: deploy

on:
  workflow_dispatch:
    inputs:
      if_ahead:
        description: Deploy only when main is ahead of the last successful deploy (what the evening run does)
        type: boolean
        default: false
  # 22:25 Asia/Saigon; GitHub may start it some minutes late. Repos on the shared server are 5 minutes apart.
  schedule:
    - cron: "25 15 * * *"

permissions:
  contents: read

# Never cancel a deploy halfway; later runs wait their turn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # The evening run, and a run started by hand with if_ahead, deploys only
  # when main moved since the last successful deploy; any other run started by
  # hand always deploys (for example to redeploy).
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      needed: ${{ steps.compare.outputs.needed }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          IF_AHEAD: ${{ inputs.if_ahead }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$IF_AHEAD" != true ]; then
            echo "needed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --status success --limit 1 \
            --json headSha --jq '.[].headSha')"
          if [ "$last" = "$SHA" ]; then
            echo "production already runs $SHA; nothing to deploy"
            echo "needed=false" >>"$GITHUB_OUTPUT"
          else
            echo "main is at $SHA, last deploy was ${last:-none}"
            echo "needed=true" >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # Only a commit whose push to main passed `ci` goes to production. A run
      # started right after a push waits for that commit's `ci` (up to 30 min).
      - name: ci passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 90); do
            state="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event push --branch main \
              --commit "$SHA" --limit 1 --json status,conclusion --jq '.[] | "\(.status) \(.conclusion)"')"
            case "$state" in
              "completed success") echo "ci passed for $SHA"; exit 0 ;;
              completed*) echo "::error::ci of $SHA ended: $state"; exit 1 ;;
            esac
            echo "waiting for ci of $SHA (${state:-not started})"
            sleep 20
          done
          echo "::error::ci of $SHA did not finish within 30 minutes"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release
        name: build release
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "id=$(date -u +%Y%m%d-%H%M%S)-${SHA:0:12}" >>"$GITHUB_OUTPUT"
          pnpm build
          # The same three folders infra/deploy.sh ships: the server bundle needs only Node and the migrations.
          mkdir release
          tar cf - apps/web/dist apps/server/dist apps/server/drizzle | tar xf - -C release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      # The server address and SSH port are secrets so the public repository does not show them.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      TARGET: lockin-deploy@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - name: ssh setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_PORT" >~/.ssh/config
      - name: upload and activate
        run: |
          rsync -rltz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r release/ "$TARGET:/var/www/lockin/ci-incoming/$RELEASE_ID/"
          ssh "$TARGET" "sudo -n /usr/local/sbin/lockin-activate-incoming $RELEASE_ID"
      - name: smoke from outside
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' https://lockin.hoandat.com/)"
          [ "$code" = 200 ] || { echo "https://lockin.hoandat.com/ -> $code" >&2; exit 1; }
          health="$(curl -fsS https://lockin.hoandat.com/healthz | tr -d '\r\n')"
          [ "$health" = ok ] || { echo "healthz answered '$health'" >&2; exit 1; }
          served="$(curl -fsS "https://lockin.hoandat.com/RELEASE?v=$RELEASE_ID" | tr -d '\r\n')"
          [ "$served" = "$RELEASE_ID" ] || { echo "origin serves '$served', expected $RELEASE_ID" >&2; exit 1; }
      - if: always()
        run: rm -f ~/.ssh/deploy_key
